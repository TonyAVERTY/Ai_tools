<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" role="img" aria-label="Écran : tu choisis qui contacter, où et combien">
<style>
.p{fill:#fff}.bg{fill:#f4f5f7}.ln{stroke:#e2e4e8;fill:none}.tx{fill:#17191c}.mu{fill:#6b7078}.ac{fill:#2f5bea}.on{fill:#fff}.soft{fill:#e6ecfd}.ok{fill:#15803d}.okb{fill:#dcf3e4}.fr{fill:#17191c}.wr{fill:#b45309}.wrb{fill:#fdeed9}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){.p{fill:#1a1d22}.bg{fill:#111317}.ln{stroke:#2b2f36}.tx{fill:#e8eaed}.mu{fill:#9097a1}.ac{fill:#5b82ff}.on{fill:#111317}.soft{fill:#232b45}.ok{fill:#4ade80}.okb{fill:#1c3326}.fr{fill:#3a3f48}.wr{fill:#fbbf24}.wrb{fill:#3a2e14}}
</style>
<rect x="14" y="8" width="272" height="544" rx="38" class="fr"/>
<rect x="20" y="14" width="260" height="532" rx="33" class="p"/>
<rect x="112" y="22" width="76" height="20" rx="10" class="fr"/>
<text x="38" y="78" class="tx" font-size="19" font-weight="700">La cible</text>
<text x="38" y="98" class="mu" font-size="12">C'est toi qui décides</text>

<text x="38" y="130" font-size="11" class="mu">Qui veux-tu contacter ?</text>
<rect x="34" y="138" width="232" height="38" rx="10" class="bg"/><text x="48" y="161" font-size="12" class="tx">Menuiseries et artisans du bois</text>
<text x="38" y="204" font-size="11" class="mu">Où ?</text>
<rect x="34" y="212" width="232" height="38" rx="10" class="bg"/><text x="48" y="235" font-size="12" class="tx">Lyon et alentours</text>
<text x="38" y="278" font-size="11" class="mu">Combien de contacts ?</text>
<rect x="34" y="290" width="232" height="8" rx="4" class="soft"/><rect x="34" y="290" width="140" height="8" rx="4" class="ac"/><circle cx="174" cy="294" r="11" class="ac"/>
<text x="266" y="322" text-anchor="end" font-size="12" font-weight="700" class="tx">30</text>
<rect x="34" y="346" width="232" height="50" rx="12" class="wrb"/><text x="48" y="368" font-size="11" font-weight="600" class="wr">Rien ne part sans ton feu vert</text><text x="48" y="384" font-size="10.5" class="wr">Tu valides, puis la recherche démarre.</text>
<rect x="34" y="470" width="232" height="40" rx="12" class="ac"/><text x="150" y="495" text-anchor="middle" font-size="13" font-weight="600" class="on">Valider la cible</text>
</svg>
