<rect x="34" y="356" width="112" height="34" rx="17" class="soft"/><text x="90" y="377" text-anchor="middle" font-size="11.5" font-weight="600" class="ac">Objet B (test)</text>
<rect x="154" y="356" width="112" height="34" rx="17" class="soft"/><text x="210" y="377" text-anchor="middle" font-size="11.5" font-weight="600" class="ac">Relance</text>
<rect x="34" y="470" width="232" height="40" rx="12" class="ac"/><text x="150" y="495" text-anchor="middle" font-size="13" font-weight="600" class="on">Valider le modèle</text>
