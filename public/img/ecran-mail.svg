<text x="38" y="98" class="mu" font-size="12">Écrit pour toi, relu par toi</text>

<rect x="34" y="116" width="232" height="30" rx="10" class="bg"/><text x="46" y="136" font-size="11" class="mu">Objet : </text><text x="88" y="136" font-size="11" font-weight="600" class="tx">Une idée pour vos devis</text>
<rect x="34" y="154" width="232" height="190" rx="14" class="bg"/>
