</style>
<rect x="14" y="8" width="272" height="544" rx="38" class="fr"/>
<rect x="20" y="14" width="260" height="532" rx="33" class="p"/>
<rect x="112" y="22" width="76" height="20" rx="10" class="fr"/>
<text x="38" y="78" class="tx" font-size="19" font-weight="700">Ton projet</text>
<text x="38" y="98" class="mu" font-size="12">Lu en quelques minutes</text>

<rect x="34" y="118" width="232" height="150" rx="14" class="bg"/>
<text x="48" y="142" font-size="12" font-weight="700" class="tx">Atelier Exemple</text>
<rect x="48" y="154" width="150" height="7" rx="3.5" class="ln"/>
<rect x="48" y="154" width="150" height="7" rx="3.5" class="soft"/>
<rect x="48" y="170" width="196" height="7" rx="3.5" class="soft"/>
<rect x="48" y="186" width="120" height="7" rx="3.5" class="soft"/>
<rect x="48" y="208" width="84" height="22" rx="11" class="okb"/><text x="90" y="223" text-anchor="middle" font-size="10.5" font-weight="600" class="ok">fiche prête</text>
<rect x="140" y="208" width="104" height="22" rx="11" class="soft"/><text x="192" y="223" text-anchor="middle" font-size="10.5" font-weight="600" class="ac">3 arguments</text>
<text x="38" y="300" font-size="12" font-weight="700" class="tx">Ce que Claude a compris</text>
<rect x="34" y="312" width="232" height="38" rx="10" class="bg"/><text x="48" y="335" font-size="11" class="mu">Des menuisiers qui veulent plus de devis</text>
