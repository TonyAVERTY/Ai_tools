<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" role="img" aria-label="Écran : Claude lit ton projet et écrit une fiche">
<style>
.p{fill:#fff}.bg{fill:#f4f5f7}.ln{stroke:#e2e4e8;fill:none}.tx{fill:#17191c}.mu{fill:#6b7078}.ac{fill:#2f5bea}.on{fill:#fff}.soft{fill:#e6ecfd}.ok{fill:#15803d}.okb{fill:#dcf3e4}.fr{fill:#17191c}.wr{fill:#b45309}.wrb{fill:#fdeed9}
