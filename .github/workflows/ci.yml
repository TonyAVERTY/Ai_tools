# Vérifie chaque PR et chaque push sur main : syntaxe puis tests (comme le hook .githooks/pre-commit).
# Pour limiter les minutes consommées : develop n'est plus rejoué après la fusion d'une PR (la PR l'a déjà été ; le passage en
# production, develop vers main, rejoue tout), et un changement qui ne touche que README.md ou docs/*.md (aucun test ne les lit ;
# docs/support/ et docs/security/ restent testés) ne lance rien. Lancement à la main possible depuis l'onglet Actions.
name: CI

on:
  pull_request:
    paths-ignore: ['README.md', 'docs/*.md']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Les tests de la vidéo de promotion ont besoin de ffmpeg et d'un Chromium (sinon ils sont ignorés ou échouent)
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run lint
      # Les tests qui lancent Chromium tournent un fichier à la fois (voir scripts/run-tests.js)
      - name: Tests
        run: npm test
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome

  # Vérifications d'interface dans un vrai navigateur (scripts/*-check.mjs et responsive-audit), en parallèle des tests
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Une vraie base MariaDB pour scripts/bdd-check.mjs (choix des tables du Récapitulatif). Variables BDD_CHECK_DB_* : l'application de test reste sur SQLite.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      # Playwright n'est pas une dépendance du projet : seul le pilote est installé, avec le Chrome de l'image
      - run: npm install --no-save playwright-core@1.63.0
      - name: Vérifications d'interface
        run: npm run ui:check
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          CHROMIUM_BIN: /usr/bin/google-chrome
          BDD_CHECK_DB_HOST: 127.0.0.1
          BDD_CHECK_DB_USER: root
          BDD_CHECK_DB_PASSWORD: test

  # Les mêmes tests sur un vrai MariaDB : la production tourne sur MySQL/MariaDB, les autres jobs ne voient que SQLite (migrations comprises)
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Tests sur MariaDB
        # Le détail des échecs est répété en fin de journal : sinon il se perd au milieu de ~4 500 lignes
        run: |
          npm run test:mysql 2>&1 | tee mysql-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then echo "=== ÉCHECS ==="; grep -E "^not ok" -A14 mysql-tests.log | head -150; fi
          exit "$status"
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test
          TEST_DB_NAME: aitools_test
          CHROMIUM_BIN: /usr/bin/google-chrome
