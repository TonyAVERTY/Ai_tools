# Vérifie chaque PR et chaque push sur develop/main : syntaxe puis tests (comme le hook .githooks/pre-commit).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Les tests de la vidéo de promotion ont besoin de ffmpeg et d'un Chromium (sinon ils sont ignorés ou échouent)
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run lint
      # Les tests qui lancent Chromium tournent un fichier à la fois (voir scripts/run-tests.js)
      - name: Tests
        run: npm test
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
