# Vérifie chaque PR et chaque push sur develop/main : syntaxe puis tests (comme le hook .githooks/pre-commit).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Les tests de la vidéo de promotion ont besoin de ffmpeg et d'un Chromium (sinon ils sont ignorés ou échouent)
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run lint
      # Les tests qui lancent Chromium tournent un fichier à la fois (voir scripts/run-tests.js)
      - name: Tests
        run: npm test
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome

  # Vérifications d'interface dans un vrai navigateur (scripts/*-check.mjs et responsive-audit), en parallèle des tests
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      # Playwright n'est pas une dépendance du projet : seul le pilote est installé, avec le Chrome de l'image
      - run: npm install --no-save playwright-core@1.63.0
      - name: Vérifications d'interface
        run: npm run ui:check
        env:
          PLAYWRIGHT_CHROMIUM: /usr/bin/google-chrome
          CHROMIUM_BIN: /usr/bin/google-chrome

  # Les mêmes tests sur un vrai MariaDB : la production tourne sur MySQL/MariaDB, les autres jobs ne voient que SQLite (migrations comprises)
  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Tests sur MariaDB
        run: npm run test:mysql
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test
          TEST_DB_NAME: aitools_test
          CHROMIUM_BIN: /usr/bin/google-chrome
