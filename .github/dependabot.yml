# Mises à jour automatiques proposées chaque semaine : dépendances npm et actions GitHub. Chaque mise à jour passe par la CI ;
# une mise à jour majeure se relit (compatibilité, régressions) avant fusion.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
